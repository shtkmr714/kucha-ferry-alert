name: Instagram Token Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Instagram token (read-only, no posting)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          set +e
          for V in "" "v25.0/" "v23.0/" "v21.0/"; do
            echo "=== graph.instagram.com/${V}{USER_ID} ==="
            code=$(curl -s -o /tmp/x.json -w "%{http_code}" \
              "https://graph.instagram.com/${V}${INSTAGRAM_USER_ID}?fields=username&access_token=${INSTAGRAM_ACCESS_TOKEN}")
            echo "HTTP $code"; cat /tmp/x.json; echo; echo
          done
          echo "=== token expiry (debug via graph.instagram.com/me) ==="
          curl -s "https://graph.instagram.com/me?fields=user_id,username&access_token=${INSTAGRAM_ACCESS_TOKEN}"; echo